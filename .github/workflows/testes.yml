name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r .claude/skills/gerar-telas/requirements.txt
      - name: Rodar testes
        run: python -m unittest discover tests -v
